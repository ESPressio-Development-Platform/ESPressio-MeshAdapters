name: State outbound A2 contract

on:
  push:
    branches: [primitives_redesign]
  pull_request:

jobs:
  state-outbound:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {path: ESPressio-MeshAdapters}
      - uses: actions/checkout@v4
        with: {repository: ESPressio-Development-Platform/ESPressio-Mesh, ref: primitives_redesign, path: ESPressio-Mesh}
      - uses: actions/checkout@v4
        with: {repository: ESPressio-Development-Platform/ESPressio-Adapters, ref: primitives_redesign, path: ESPressio-Adapters}
      - uses: actions/checkout@v4
        with: {repository: ESPressio-Development-Platform/ESPressio-Primitive, ref: primitives_redesign, path: ESPressio-Primitive}
      - uses: actions/checkout@v4
        with: {repository: ESPressio-Development-Platform/ESPressio-System, ref: primitives_redesign, path: ESPressio-System}
      - uses: actions/checkout@v4
        with: {repository: ESPressio-Development-Platform/ESPressio-State, ref: primitives_redesign, path: ESPressio-State}
      - uses: actions/checkout@v4
        with: {repository: ESPressio-Development-Platform/ESPressio-Persistence, ref: primitives_redesign, path: ESPressio-Persistence}
      - uses: actions/checkout@v4
        with: {repository: ESPressio-Development-Platform/ESPressio-Task, ref: primitives_redesign, path: ESPressio-Task}
      - uses: actions/checkout@v4
        with: {repository: ESPressio-Development-Platform/ESPressio-Threads, ref: primitives_redesign, path: ESPressio-Threads}
      - uses: actions/checkout@v4
        with: {repository: ESPressio-Development-Platform/ESPressio-Timing, ref: primitives_redesign, path: ESPressio-Timing}
      - uses: actions/checkout@v4
        with: {repository: ESPressio-Development-Platform/ESPressio-Serializable, ref: primitives_redesign, path: ESPressio-Serializable}
      - uses: actions/checkout@v4
        with: {repository: ESPressio-Development-Platform/ESPressio-Units, ref: primitives_redesign, path: ESPressio-Units}
      - uses: actions/checkout@v4
        with: {repository: ESPressio-Development-Platform/ESPressio-Observable, ref: primitives_redesign, path: ESPressio-Observable}
      - name: Build State-to-A2 convergence contract
        run: >-
          g++ -std=c++17 -Wall -Wextra -Werror -fno-rtti
          -IESPressio-MeshAdapters/src
          -IESPressio-Mesh/src
          -IESPressio-Adapters/src
          -IESPressio-Primitive/src
          -IESPressio-System/src
          -IESPressio-State/src
          -IESPressio-Persistence/src
          -IESPressio-Task/src
          -IESPressio-Task/tests
          -IESPressio-Threads/src
          -IESPressio-Timing/src
          -IESPressio-Timing/tests/stubs
          -IESPressio-Serializable/src
          -IESPressio-Units/src
          -IESPressio-Observable/src
          ESPressio-MeshAdapters/tests/state_mesh_adapter_outbound_test.cpp
          -o state_mesh_adapter_outbound_test -pthread
      - name: Run State-to-A2 convergence contract
        run: ./state_mesh_adapter_outbound_test
