name: MeshAdapters redesign contracts

on:
  push:
    branches:
      - primitives_redesign
  pull_request:

jobs:
  host-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: ESPressio-MeshAdapters
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-Mesh
          ref: primitives_redesign
          path: ESPressio-Mesh
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-Adapters
          ref: primitives_redesign
          path: ESPressio-Adapters
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-Primitive
          ref: primitives_redesign
          path: ESPressio-Primitive
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-System
          ref: primitives_redesign
          path: ESPressio-System
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-Event
          ref: primitives_redesign
          path: ESPressio-Event
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-Command
          ref: primitives_redesign
          path: ESPressio-Command
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-State
          ref: primitives_redesign
          path: ESPressio-State
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-Persistence
          ref: primitives_redesign
          path: ESPressio-Persistence
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-Security
          ref: primitives_redesign
          path: ESPressio-Security
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-Task
          ref: primitives_redesign
          path: ESPressio-Task
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-Threads
          ref: primitives_redesign
          path: ESPressio-Threads
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-Timing
          ref: primitives_redesign
          path: ESPressio-Timing
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-Serializable
          ref: primitives_redesign
          path: ESPressio-Serializable
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-Units
          ref: primitives_redesign
          path: ESPressio-Units
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-Observable
          ref: primitives_redesign
          path: ESPressio-Observable
      - name: Build bounded Mesh-to-A2 ingress correlation contract
        run: >-
          g++ -std=c++17 -Wall -Wextra -Werror -fno-rtti
          -IESPressio-MeshAdapters/src
          -IESPressio-Mesh/src
          -IESPressio-Adapters/src
          -IESPressio-Primitive/src
          -IESPressio-System/src
          ESPressio-MeshAdapters/tests/mesh_adapter_ingress_test.cpp
          -o mesh_adapter_ingress_test -pthread
      - name: Run bounded Mesh-to-A2 ingress correlation contract
        run: ./mesh_adapter_ingress_test
      - name: Build neutral A2-to-Mesh lower transport contract
        run: >-
          g++ -std=c++17 -Wall -Wextra -Werror -fno-rtti
          -IESPressio-MeshAdapters/src
          -IESPressio-Mesh/src
          -IESPressio-Adapters/src
          -IESPressio-Primitive/src
          -IESPressio-System/src
          ESPressio-MeshAdapters/tests/mesh_lower_transport_binding_test.cpp
          -o mesh_lower_transport_binding_test -pthread
      - name: Run neutral A2-to-Mesh lower transport contract
        run: ./mesh_lower_transport_binding_test
      - name: Build real Event family MeshAdapter binding contract
        run: >-
          g++ -std=c++17 -Wall -Wextra -Werror -fno-rtti
          -IESPressio-MeshAdapters/src
          -IESPressio-Mesh/src
          -IESPressio-Adapters/src
          -IESPressio-Primitive/src
          -IESPressio-System/src
          -IESPressio-Event/src
          -IESPressio-Task/src
          -IESPressio-Task/tests
          -IESPressio-Threads/src
          -IESPressio-Timing/src
          -IESPressio-Timing/tests/stubs
          -IESPressio-Serializable/src
          -IESPressio-Units/src
          -IESPressio-Observable/src
          ESPressio-MeshAdapters/tests/event_mesh_adapter_binding_test.cpp
          -o event_mesh_adapter_binding_test -pthread
      - name: Run real Event family MeshAdapter binding contract
        run: ./event_mesh_adapter_binding_test
      - name: Build local Event-to-A2 outbound contract
        run: >-
          g++ -std=c++17 -Wall -Wextra -Werror -fno-rtti
          -IESPressio-MeshAdapters/src
          -IESPressio-Mesh/src
          -IESPressio-Adapters/src
          -IESPressio-Primitive/src
          -IESPressio-System/src
          -IESPressio-Event/src
          -IESPressio-Task/src
          -IESPressio-Task/tests
          -IESPressio-Threads/src
          -IESPressio-Timing/src
          -IESPressio-Timing/tests/stubs
          -IESPressio-Serializable/src
          -IESPressio-Units/src
          -IESPressio-Observable/src
          ESPressio-MeshAdapters/tests/event_mesh_adapter_outbound_test.cpp
          -o event_mesh_adapter_outbound_test -pthread
      - name: Run local Event-to-A2 outbound contract
        run: ./event_mesh_adapter_outbound_test
      - name: Prepare Command contract fixture
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("ESPressio-MeshAdapters/tests/command_mesh_adapter_binding_test.cpp")
          text = path.read_text()
          text = text.replace("#include <ESPressio_Serializable.hpp>", "#include <ESPressio_SerializationMacros.hpp>", 1)
          anchor = "    auto broadcastReply=replyContext;broadcastReply.Broadcast=true;\n"
          if anchor not in text:
              raise SystemExit("Command broadcast probe anchor missing")
          text = text.replace(anchor,anchor + "    Adapters::AdapterSemanticProvenance broadcastProvenance{};\n",1)
          old = "        {replyWire.data(),replyBytes},policy,provenance)==MeshAdapters::MeshAdapterPolicyResolution::Rejected);"
          new = "        {replyWire.data(),replyBytes},policy,broadcastProvenance)==MeshAdapters::MeshAdapterPolicyResolution::Rejected);"
          if old not in text:
              raise SystemExit("Command broadcast provenance probe missing")
          text = text.replace(old,new,1)
          old_duplicate = '''    const auto duplicate=adapter.Family.AdmitInbound(adapter.Family.Owner,C::CommandProtocolVersion,\n        {replyWire.data(),replyBytes},duplicateProvenance);\n    assert(duplicate==Primitive::PrimitiveAdmissionDisposition::AlreadyAccepted);\n'''
          new_duplicate = '''    auto duplicate=Primitive::PrimitiveAdmissionDisposition::TemporarilyUnavailable;\n    Eventually([&]{\n        duplicate=adapter.Family.AdmitInbound(adapter.Family.Owner,C::CommandProtocolVersion,\n            {replyWire.data(),replyBytes},duplicateProvenance);\n        return duplicate!=Primitive::PrimitiveAdmissionDisposition::TemporarilyUnavailable;\n    });\n    assert(duplicate==Primitive::PrimitiveAdmissionDisposition::AlreadyAccepted);\n'''
          if old_duplicate not in text:
              raise SystemExit("Command duplicate timing probe missing")
          text = text.replace(old_duplicate,new_duplicate,1)
          path.write_text(text)
          PY
      - name: Build real Command family MeshAdapter binding contract
        run: >-
          g++ -std=c++17 -Wall -Wextra -Werror -fno-rtti
          -IESPressio-MeshAdapters/src
          -IESPressio-Mesh/src
          -IESPressio-Adapters/src
          -IESPressio-Primitive/src
          -IESPressio-System/src
          -IESPressio-Command/src
          -IESPressio-Persistence/src
          -IESPressio-Security/src
          -IESPressio-Task/src
          -IESPressio-Task/tests
          -IESPressio-Threads/src
          -IESPressio-Timing/src
          -IESPressio-Timing/tests/stubs
          -IESPressio-Serializable/src
          -IESPressio-Units/src
          -IESPressio-Observable/src
          ESPressio-MeshAdapters/tests/command_mesh_adapter_binding_test.cpp
          -o command_mesh_adapter_binding_test -pthread
      - name: Run real Command family MeshAdapter binding contract
        run: ./command_mesh_adapter_binding_test
      - name: Build local Command-to-A2 outbound contract
        run: >-
          g++ -std=c++17 -Wall -Wextra -Werror -fno-rtti
          -IESPressio-MeshAdapters/src
          -IESPressio-Mesh/src
          -IESPressio-Adapters/src
          -IESPressio-Primitive/src
          -IESPressio-System/src
          -IESPressio-Command/src
          -IESPressio-Persistence/src
          -IESPressio-Security/src
          -IESPressio-Task/src
          -IESPressio-Task/tests
          -IESPressio-Threads/src
          -IESPressio-Timing/src
          -IESPressio-Timing/tests/stubs
          -IESPressio-Serializable/src
          -IESPressio-Units/src
          -IESPressio-Observable/src
          ESPressio-MeshAdapters/tests/command_mesh_adapter_outbound_test.cpp
          -o command_mesh_adapter_outbound_test -pthread
      - name: Run local Command-to-A2 outbound contract
        run: ./command_mesh_adapter_outbound_test
      - name: Build real State family MeshAdapter binding contract
        run: >-
          g++ -std=c++17 -Wall -Wextra -Werror -fno-rtti
          -IESPressio-MeshAdapters/src
          -IESPressio-Mesh/src
          -IESPressio-Adapters/src
          -IESPressio-Primitive/src
          -IESPressio-System/src
          -IESPressio-State/src
          -IESPressio-Persistence/src
          -IESPressio-Task/src
          -IESPressio-Task/tests
          -IESPressio-Threads/src
          -IESPressio-Timing/src
          -IESPressio-Timing/tests/stubs
          -IESPressio-Serializable/src
          -IESPressio-Units/src
          -IESPressio-Observable/src
          ESPressio-MeshAdapters/tests/state_mesh_adapter_binding_test.cpp
          -o state_mesh_adapter_binding_test -pthread
      - name: Run real State family MeshAdapter binding contract
        run: ./state_mesh_adapter_binding_test
